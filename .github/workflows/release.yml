name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            out: ghc-linux-x86_64.tar.gz
          - os: windows-latest
            target: windows-x86_64
            out: ghc-windows-x86_64.zip
          - os: macos-latest
            target: macos-x86_64
            out: ghc-macos-x86_64.tar.gz

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust (non-Windows)
        if: runner.os != 'Windows'
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Install Rust (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://static.rust-lang.org/rustup/dist/x86_64-pc-windows-msvc/rustup-init.exe"
          $exe = "$env:RUNNER_TEMP\rustup-init.exe"
          Invoke-WebRequest -Uri $url -OutFile $exe -UseBasicParsing
          & $exe -y --default-toolchain stable --profile minimal
          "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          rustc -V
          cargo -V

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/ghc dist/ghc
          chmod +x dist/ghc
          tar -czf "${{ matrix.out }}" -C dist ghc

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/ghc dist/ghc
          chmod +x dist/ghc
          tar -czf "${{ matrix.out }}" -C dist ghc

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\ghc.exe dist\
          Compress-Archive -Path dist\ghc.exe -DestinationPath "${{ matrix.out }}" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.out }}
          if-no-files-found: error

  publish-release:
    name: publish release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Collect release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find dist -type f \( -name "*.zip" -o -name "*.tar.gz" \) -print -exec cp {} release/ \;
          ls -la release

      - name: Create/Update GitHub Release + upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          fail_on_unmatched_files: true

  update-package-managers:
    name: update scoop + homebrew
    runs-on: ubuntu-latest
    needs: publish-release
    steps:
      - name: Compute version + asset URLs
        id: meta
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          REPO="AdelinAndrica/ghc"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "win_url=https://github.com/$REPO/releases/download/$TAG/ghc-windows-x86_64.zip" >> "$GITHUB_OUTPUT"
          echo "mac_url=https://github.com/$REPO/releases/download/$TAG/ghc-macos-x86_64.tar.gz" >> "$GITHUB_OUTPUT"
          echo "lin_url=https://github.com/$REPO/releases/download/$TAG/ghc-linux-x86_64.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Download assets + sha256
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 15 --retry-delay 2 --retry-connrefused -o win.zip "${{ steps.meta.outputs.win_url }}"
          curl -fsSL --retry 15 --retry-delay 2 --retry-connrefused -o mac.tar.gz "${{ steps.meta.outputs.mac_url }}"
          curl -fsSL --retry 15 --retry-delay 2 --retry-connrefused -o lin.tar.gz "${{ steps.meta.outputs.lin_url }}"
          sha256sum win.zip | awk '{print $1}' > win.sha
          sha256sum mac.tar.gz | awk '{print $1}' > mac.sha
          sha256sum lin.tar.gz | awk '{print $1}' > lin.sha

      - name: Update Scoop bucket (AdelinAndrica/ghc-scoop)
        shell: bash
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${{ secrets.REPO_PUSH_TOKEN }}@github.com/AdelinAndrica/ghc-scoop.git" scoop
          cd scoop
          python -c 'import json; p="bucket/ghc.json"; d=json.load(open(p,"r",encoding="utf-8")); d["version"]="${{ steps.meta.outputs.ver }}"; d["homepage"]="https://github.com/AdelinAndrica/ghc"; d["architecture"]["64bit"]["url"]="${{ steps.meta.outputs.win_url }}"; d["architecture"]["64bit"]["hash"]=open("../win.sha","r",encoding="utf-8").read().strip(); json.dump(d, open(p,"w",encoding="utf-8"), indent=2); open(p,"a",encoding="utf-8").write("\n")'
          git config user.name "ghc-bot"
          git config user.email "ghc-bot@users.noreply.github.com"
          git add bucket/ghc.json
          git commit -m "ghc ${{ steps.meta.outputs.ver }}" || exit 0
          git push

      - name: Update Homebrew tap (AdelinAndrica/homebrew-ghc)
        shell: bash
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${{ secrets.REPO_PUSH_TOKEN }}@github.com/AdelinAndrica/homebrew-ghc.git" brew
          cd brew
          python -c 'import re; from pathlib import Path; p=Path("Formula/ghc.rb"); s=p.read_text(encoding="utf-8"); ver="${{ steps.meta.outputs.ver }}"; mac_url="${{ steps.meta.outputs.mac_url }}"; lin_url="${{ steps.meta.outputs.lin_url }}"; mac_sha=Path("../mac.sha").read_text(encoding="utf-8").strip(); lin_sha=Path("../lin.sha").read_text(encoding="utf-8").strip(); s=re.sub(r"^\s*version\s+\"[^\"]+\"", f"  version \"{ver}\"", s, flags=re.M); s=re.sub(r"^\s*url\s+\"[^\"]*ghc-macos-x86_64\.tar\.gz\"", f"    url \"{mac_url}\"", s, flags=re.M); s=re.sub(r"^\s*url\s+\"[^\"]*ghc-linux-x86_64\.tar\.gz\"", f"    url \"{lin_url}\"", s, flags=re.M); s=re.sub(r"^\s*sha256\s+\"[^\"]+\"", f"    sha256 \"{mac_sha}\"", s, count=1, flags=re.M); s=re.sub(r"^\s*sha256\s+\"[^\"]+\"", f"    sha256 \"{lin_sha}\"", s, count=1, flags=re.M); p.write_text(s, encoding="utf-8")'
          git config user.name "ghc-bot"
          git config user.email "ghc-bot@users.noreply.github.com"
          git add Formula/ghc.rb
          git commit -m "ghc ${{ steps.meta.outputs.ver }}" || exit 0
          git push
